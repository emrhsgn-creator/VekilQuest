name: Slow-Mo Rush APK

# Oyunun test APK'sını derler, Android emülatöründe açılıp açılmadığını
# denetler ve ancak açılıyorsa telefondan indirilebilsin diye
# "slow-mo-rush-test" adlı ön sürüme (pre-release) yükler.
on:
  push:
    branches: [slow-mo-rush]
    paths:
      - 'slow_mo_rush/**'
      - '.github/workflows/slow-mo-rush-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slow-mo-rush-apk
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slow_mo_rush
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: APK derle
        run: |
          # Her derleme ayrı sürüm numarası alır (Ayarlar → Uygulamalar'da görünür).
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk slow-mo-rush.apk

      - uses: actions/upload-artifact@v4
        with:
          name: slow-mo-rush-apk
          path: slow_mo_rush/slow-mo-rush.apk

  emulator:
    needs: derle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Android 7 (minSdk), 10 ve 14.
        api-level: [24, 29, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: slow-mo-rush-apk

      - name: KVM'yi etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde aç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash slow_mo_rush/tool/emulator_smoke.sh slow-mo-rush.apk

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-api${{ matrix.api-level }}
          path: smoke/

  yayinla:
    needs: emulator
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: slow-mo-rush-apk

      - name: Ön sürüme yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: slow-mo-rush-test
          name: Slow-Mo Rush 1.0.${{ github.run_number }} (test)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Telefona doğrudan kurulabilen test APK'sı (Google test reklamlarıyla).
            Sürüm: 1.0.${{ github.run_number }}
            Android 7, 10 ve 14 emülatörlerinde açılış testi geçti.
            Commit: ${{ github.sha }}
          files: slow-mo-rush.apk
